# Build de l'image Docker et déploiement auto-hébergé (docs/infra/migration-vps-ovh.md).
#
# - `main`    → environnement GitHub `production`
# - `staging` → environnement GitHub `staging`
#
# Chaque environnement porte ses propres *variables* (publiques, inlinées dans le
# bundle) et *secrets* :
#   vars    : NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SENTRY_DSN, SENTRY_ORG, SENTRY_PROJECT,
#             APP_URL (optionnelle : origine publique de l'app, ex.
#             https://prod-vps.mijote.anthonykocken.fr — active la vérification
#             post-déploiement sur /api/version)
#   secrets : SENTRY_AUTH_TOKEN (optionnel, source maps),
#             DOKPLOY_URL + DOKPLOY_TOKEN + DOKPLOY_APP_ID (optionnels : déploiement)
#
# Le job `checks` (lint, types, tests) bloque le build : rien n'est publié si la
# CI échoue. Tant que DOKPLOY_TOKEN n'est pas défini, le workflow se contente de
# construire et publier l'image sur GHCR : aucun effet sur Vercel. Les applications
# Dokploy créées depuis une image n'ont pas de webhook : on appelle son API
# `application.deploy` (x-api-key), qui tire le tag de branche et redémarre.
#
# Actions épinglées par SHA de commit (le tag en commentaire) : un tag peut être
# déplacé, pas un SHA. Mettre à jour à la main (gh api repos/<o>/<r>/git/ref/tags/<tag>).

name: Deploy (Docker)

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

  build:
    needs: checks
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      # Nom d'image en minuscules (le dépôt s'appelle `antKock/atable`).
      IMAGE: ghcr.io/antkock/atable
      # Les secrets ne sont pas lisibles dans un `if:` — on passe par env.
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
      DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          echo "sha=${IMAGE}:${{ github.ref_name }}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "branch=${IMAGE}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.branch }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ github.ref_name == 'main' && 'production' || 'staging' }}
            GIT_COMMIT_SHA=${{ github.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dokploy : l'application est configurée sur le tag de branche
      # (`ghcr.io/antkock/atable:staging` / `:main`) ; l'API lui fait tirer la
      # nouvelle image et redémarrer le conteneur.
      - name: Trigger Dokploy deploy
        if: ${{ env.DOKPLOY_TOKEN != '' }}
        run: |
          curl -fsS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -H "accept: application/json" \
            -d "{\"applicationId\":\"$DOKPLOY_APP_ID\"}"

      # Vérification : `/api/version` (force-dynamic, { buildId }) doit renvoyer le SHA
      # de ce commit (NEXT_PUBLIC_BUILD_ID = GIT_COMMIT_SHA, cf. next.config.ts).
      # Le déploiement Dokploy est asynchrone (tirage de l'image + grace period 90 s) :
      # on interroge toutes les 10 s pendant 5 min, puis on échoue le job.
      - name: Verify deployment
        if: ${{ env.DOKPLOY_TOKEN != '' && env.APP_URL != '' }}
        run: |
          expected="${{ github.sha }}"
          url="${APP_URL%/}/api/version"
          for i in $(seq 1 30); do
            actual="$(curl -fsS --max-time 10 "$url" | jq -r '.buildId' 2>/dev/null || true)"
            echo "[$i/30] $url → ${actual:-(pas de réponse)}"
            if [ "$actual" = "$expected" ]; then
              echo "Déployé : buildId = $expected"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$url ne renvoie pas le build $expected après 5 min (dernier : ${actual:-aucun})"
          exit 1
